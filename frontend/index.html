<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Margins &amp; Mugs | Welcome</title>
    <title>Margins &amp; Mugs | Welcome</title>
    <link rel="stylesheet" href="css/style.css?v=2">
</head>

<body class="login-page">
    <main class="login-card">
        <p class="eyebrow">WELCOME TO</p>
        <h1 class="brand-title">MARGINS &amp; MUGS</h1>
        <p class="muted">A cozy cafe for coffee, bites, and books.</p>
        <form id="login-form" class="form-stack">
            <label for="customer-name">Your name</label><input id="customer-name" name="name" autocomplete="name"
                required>
            <label for="customer-phone">Phone number</label><input id="customer-phone" name="phone" type="tel"
                autocomplete="tel" required>
            <p class="form-message" id="login-message" aria-live="polite"></p>
            <button class="button button-primary" type="submit">Enter the cafe</button>
        </form>
    </main>
    <script src="js/app.js"></script>
</body>

</html>
